services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - qdrant
      - redis
      - postgres
  worker:
    build: .
    command: python -m src.workers.tasks
    env_file: .env
    environment:
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    depends_on:
      - redis
      - qdrant
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  qdrant_data:
  postgres_data:

